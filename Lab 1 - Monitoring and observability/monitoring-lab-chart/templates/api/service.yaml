apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-api"
  labels:
    app: api
    release: "{{ .Release.Name }}"
spec:
  type: NodePort
  selector:
    app: api
    release: "{{ .Release.Name }}"
  ports:
    - name: http
      port: {{ .Values.labService.service.port }}
      targetPort: {{ .Values.labService.service.port }}
      nodePort: {{ .Values.labService.service.nodePort }}
