apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-prometheus"
  labels:
    app: prometheus
    release: "{{ .Release.Name }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      release: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app: prometheus
        release: "{{ .Release.Name }}"
    spec:
      containers:
        - name: prometheus
          image: "prom/prometheus:{{ .Values.prometheus.image.tag }}"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
      volumes:
        - name: prometheus-config
          configMap:
            name: "{{ .Release.Name }}-prometheus-config"