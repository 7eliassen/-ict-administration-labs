apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-prometheus-config"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - "/etc/prometheus/lab-rules.yml"
    scrape_configs:
      - job_name: 'api'
        static_configs:
          - targets: ['{{ .Release.Name }}-api:{{ .Values.labService.service.port }}']
    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['{{ .Release.Name }}-alertmanager:9093']
  lab-rules.yml: |
    groups:
      - name: lab
        rules:
          - alert: CheckIsDown
            expr: up{job="api"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Service is down"

          - alert: HighErrorRate
            expr: |
              rate(http_errors_total{job="api"}[1m])
              /
              rate(http_requests_total{job="api"}[1m]) > 0.1
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"

          - alert: HighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(http_request_duration_seconds_bucket{job="api"}[1m])
                )
              ) > 2
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High latency detected"

          - alert: RequestSpike
            expr: sum(rate(http_requests_total{job="api"}[1m])) > 5
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High request rate detected"