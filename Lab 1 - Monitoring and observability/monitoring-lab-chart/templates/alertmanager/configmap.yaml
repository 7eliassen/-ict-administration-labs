apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-alertmanager-config"
data:
  alertmanager.yml: |
    route:
      receiver: 'email'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
    receivers:
      - name: "email"
        email_configs:
          - to: "{{ .Values.alertmanager.email_configs.to }}"
            from: "{{ .Values.alertmanager.email_configs.from }}"
            smarthost: '{{ .Values.alertmanager.email_configs.smarthost }}'
            auth_username: "{{ .Values.alertmanager.email_configs.auth_username }}"
            auth_password: "{{ .Values.alertmanager.email_configs.auth_password }}"