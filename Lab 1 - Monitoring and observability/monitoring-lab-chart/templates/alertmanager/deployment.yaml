apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-alertmanager"
  labels:
    app: alertmanager
    release: "{{ .Release.Name }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
      release: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app: alertmanager
        release: "{{ .Release.Name }}"
    spec:
      containers:
        - name: alertmanager
          image: "prom/alertmanager:{{ .Values.alertmanager.image.tag }}"
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: "{{ .Release.Name }}-alertmanager-config"