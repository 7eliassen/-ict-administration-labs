apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-alertmanager"
  labels:
    app: alertmanager
    release: "{{ .Release.Name }}"
spec:
  type: NodePort
  selector:
    app: alertmanager
    release: "{{ .Release.Name }}"
  ports:
    - name: http
      port: 9093
      targetPort: http
      nodePort: {{ .Values.alertmanager.service.nodePort }}