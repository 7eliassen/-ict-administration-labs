apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-grafana"
  labels:
    app: grafana
    release: "{{ .Release.Name }}"
spec:
  type: NodePort
  selector:
    app: grafana
    release: "{{ .Release.Name }}"
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: {{ .Values.grafana.service.nodePort }}