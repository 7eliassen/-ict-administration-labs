apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-grafana-dashboard-provider"
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: Monitoring
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
