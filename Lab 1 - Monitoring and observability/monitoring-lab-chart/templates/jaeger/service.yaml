apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-jaeger-ui"
  labels:
    app: jaeger-ui
    release: "{{ .Release.Name }}"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: all-in-one
  ports:
    - name: http
      port: 16686
      targetPort: 16686
      nodePort: {{ .Values.jaeger.service.nodePort }}
